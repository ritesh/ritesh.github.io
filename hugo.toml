# Basic config
baseURL = "https://blog.rsinha.org"
languageCode = 'en-gb'
theme = "typo"
title='Ritesh is Rambling'
copyright = "Ritesh Sinha"

# Generate robots.txt (uses layouts/robots.txt) so crawlers find the sitemap.
enableRobotsTXT = true

[taxonomies]
tag = 'tags'

# Sitemap defaults for the auto-generated sitemap.xml.
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  # Author, used for SEO metadata and structured data.
author = "Ritesh Sinha"
  # The description of your website, used for the homepage meta description,
  # Open Graph tags, and as a fallback for pages without their own description.
description = "Ritesh Sinha's blog on software security, programming, Linux, and assorted tinkering — a mix of technical notes and personal posts."
paginationSize = 25
theme = 'auto'
colorPalette = 'earthy'
hideHeader = 'true'
# The path to your favicon
favicon = "images/favicon.png"
listdateFormat = "2 Jan 2006"
# Collection to display on home
homeCollectionTitle = 'Posts'
homeCollection = 'posts'
showFooter = true
footerContent = "Powered by relentless yak-shaving and [tomfran/typo](https://tomfran.github.io/typo-wiki/)"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "trivial pursuits"
url = "/trivial-pursuits"

# Syntax highlight on code blocks.
# noClasses = false makes Chroma emit CSS classes (.chroma .k, ...) instead of
# inline colours, so the earthy light/dark highlighting in custom.css applies.
[markup]
[markup.highlight]
noClasses = false
guessSyntax = true
lineNos = false
tabWidth = 4


[[params.social]]
name = "github"
url = "https://github.com/ritesh"

[[params.social]]
name = "linkedin"
url = "https://uk.linkedin.com/in/riteshks"
